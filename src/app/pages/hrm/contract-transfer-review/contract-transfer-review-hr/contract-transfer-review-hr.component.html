<div class="ctr-page-container">
  <!-- ===== Thanh menu ===== -->
  <p-menubar [model]="menuItems" styleClass="border-0 mb-0 ctr-menubar">

    <ng-template #end>
      <div class="flex items-center gap-2">
        <button nz-button nzType="text" nzShape="circle" *ngIf="isMobile()"
          (click)="ToggleSearchPanelNew($event); $event.stopPropagation()">
          <nz-icon nzType="search" />
        </button>
      </div>
    </ng-template>
  </p-menubar>

  <!-- ===== Thanh tìm kiếm ===== -->
  <!-- Backdrop overlay cho mobile -->
  <div class="filter-backdrop" *ngIf="shouldShowSearchBar && isMobile()" (click)="ToggleSearchPanelNew()"></div>

  <!-- Filter bar -->
  <div class="filter-bar bg-light border-bottom px-2 py-1" *ngIf="shouldShowSearchBar" [class.mobile-modal]="true">
    <div class="filter-bar-header d-flex justify-content-between align-items-center mb-2" *ngIf="isMobile()">
      <span class="fw-bold" style="font-size: 12px;">Tìm kiếm</span>
      <button nz-button nzType="text" nzShape="circle" nzSize="small" nzDanger (click)="ToggleSearchPanelNew()">
        <nz-icon nzType="close" />
      </button>
    </div>

    <!-- Layout cho desktop (luôn nằm trên 1 dòng) -->
    <div class="d-flex align-items-center flex-nowrap gap-2 w-100 overflow-x-auto py-1" *ngIf="!isMobile()">
      <!-- Từ ngày -->
      <div class="d-flex align-items-center gap-1 text-nowrap">
        <span class="fs-12 fw-semibold" style="font-size: 12px;">Từ ngày:</span>
        <input type="date" [(ngModel)]="dateStart" name="dateStart2" title="Từ ngày" (ngModelChange)="onSearch()"
          style="font-size: 12px; height: 24px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 0 6px; width: 120px;" />
      </div>

      <!-- Đến ngày -->
      <div class="d-flex align-items-center gap-1 text-nowrap ms-1">
        <span class="fs-12 fw-semibold" style="font-size: 12px;">Đến ngày:</span>
        <input type="date" [(ngModel)]="dateEnd" name="dateEnd2" title="Đến ngày" (ngModelChange)="onSearch()"
          style="font-size: 12px; height: 24px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 0 6px; width: 120px;" />
      </div>

      <!-- Trạng thái -->
      <div class="d-flex align-items-center gap-1 text-nowrap ms-1">
        <span class="fs-12 fw-semibold" style="font-size: 12px;">Trạng thái:</span>
        <nz-select [(ngModel)]="step" name="step" nzPlaceHolder="-- Tất cả --" nzAllowClear nzShowSearch nzSize="small"
          style="width: 175px;" (ngModelChange)="onSearch()">
          <nz-option [nzValue]="-1" nzLabel="-- Tất cả --"></nz-option>
          <nz-option *ngFor="let s of stepOptions" [nzValue]="s.value" [nzLabel]="s.label"></nz-option>
        </nz-select>
      </div>

      <!-- Phòng ban -->
      <div class="d-flex align-items-center gap-1 text-nowrap ms-1" style="flex: 1 1 150px; min-width: 130px;">
        <span class="fs-12 fw-semibold" style="font-size: 12px;">Phòng ban:</span>
        <nz-select name="departmentId" [(ngModel)]="departmentId" nzSize="small" class="w-100" nzShowSearch
          nzAllowClear nzPlaceHolder="Tất cả phòng ban" (ngModelChange)="onSearch()">
          <nz-option *ngFor="let dept of departmentList" [nzValue]="dept.ID" [nzLabel]="dept.Name">
          </nz-option>
        </nz-select>
      </div>

      <!-- Nhân viên -->
      <div class="d-flex align-items-center gap-1 text-nowrap ms-1" style="flex: 1 1 150px; min-width: 130px;">
        <span class="fs-12 fw-semibold" style="font-size: 12px;">Nhân viên:</span>
        <nz-select name="employeeRequestId" [(ngModel)]="employeeRequestId" nzSize="small" class="w-100"
          nzShowSearch nzAllowClear nzPlaceHolder="--Chọn nhân viên--" (ngModelChange)="onSearch()">
          <ng-container *ngFor="let group of employees">
            <nz-option-group [nzLabel]="group.label">
              <nz-option *ngFor="let option of group.options"
                [nzLabel]="option.item.Code + ' - ' + option.item.FullName" [nzValue]="option.item.EmployeeID">
              </nz-option>
            </nz-option-group>
          </ng-container>
        </nz-select>
      </div>

      <!-- Từ khóa và nút tìm kiếm -->
      <div class="d-flex align-items-center gap-1 text-nowrap ms-1" style="flex: 1.5 1 180px; min-width: 160px;">
        <span class="fs-12 fw-semibold" style="font-size: 12px;">Từ khóa:</span>
        <input nz-input placeholder="Nhập từ khóa..." nzSize="small" [(ngModel)]="keyword" name="keyword"
          class="flex-grow-1" (keyup.enter)="onSearch()" />
        <button nz-button nzType="primary" style="width: 32px;" nzSize="small" (click)="onSearch()">
          <nz-icon nzType="search" />
        </button>
      </div>
    </div>

    <!-- Layout cho mobile -->
    <div class="mobile-filter-form" *ngIf="isMobile()">
      <nz-row [nzGutter]="[8, 8]" nzAlign="bottom">
        <nz-col [nzXs]="12">
          <nz-form-item class="mb-0">
            <nz-form-label class="fs-12" style="font-size: 12px;">Từ ngày</nz-form-label>
            <nz-form-control>
              <input type="date" [(ngModel)]="dateStart" name="dateStart2" title="Từ ngày" (ngModelChange)="onSearch()"
                style="width: 100%; font-size: 12px; height: 24px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 0 8px;" />
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <nz-col [nzXs]="12">
          <nz-form-item class="mb-0">
            <nz-form-label class="fs-12" style="font-size: 12px;">Đến ngày</nz-form-label>
            <nz-form-control>
              <input type="date" [(ngModel)]="dateEnd" name="dateEnd2" title="Đến ngày" (ngModelChange)="onSearch()"
                style="width: 100%; font-size: 12px; height: 24px; border: 1px solid #d9d9d9; border-radius: 2px; padding: 0 8px;" />
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <nz-col [nzXs]="24">
          <nz-form-item class="mb-0">
            <nz-form-label class="fs-12" style="font-size: 12px;">Trạng thái</nz-form-label>
            <nz-form-control>
              <nz-select [(ngModel)]="step" name="step" nzPlaceHolder="-- Tất cả --" nzAllowClear nzShowSearch
                nzSize="small" class="w-100" (ngModelChange)="onSearch()">
                <nz-option [nzValue]="-1" nzLabel="-- Tất cả --"></nz-option>
                <nz-option *ngFor="let s of stepOptions" [nzValue]="s.value" [nzLabel]="s.label"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <nz-col [nzXs]="24">
          <nz-form-item class="mb-0">
            <nz-form-label class="fs-12" style="font-size: 12px;">Phòng ban</nz-form-label>
            <nz-form-control>
              <nz-select name="departmentId" [(ngModel)]="departmentId" nzSize="small" class="w-100" nzShowSearch
                nzAllowClear nzPlaceHolder="Tất cả phòng ban" (ngModelChange)="onSearch()">
                <nz-option *ngFor="let dept of departmentList" [nzValue]="dept.ID" [nzLabel]="dept.Name">
                </nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <nz-col [nzXs]="24">
          <nz-form-item class="mb-0">
            <nz-form-label class="fs-12" style="font-size: 12px;">Nhân viên</nz-form-label>
            <nz-form-control>
              <nz-select name="employeeRequestId" [(ngModel)]="employeeRequestId" nzSize="small" class="w-100"
                nzShowSearch nzAllowClear nzPlaceHolder="--Chọn nhân viên--" (ngModelChange)="onSearch()">
                <ng-container *ngFor="let group of employees">
                  <nz-option-group [nzLabel]="group.label">
                    <nz-option *ngFor="let option of group.options"
                      [nzLabel]="option.item.Code + ' - ' + option.item.FullName" [nzValue]="option.item.EmployeeID">
                    </nz-option>
                  </nz-option-group>
                </ng-container>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <nz-col [nzXs]="24">
          <nz-form-item class="mb-0">
            <nz-form-label class="fs-12" style="font-size: 12px;">Từ khóa</nz-form-label>
            <nz-form-control>
              <div class="d-flex gap-1">
                <input nz-input placeholder="Nhập từ khóa..." nzSize="small" [(ngModel)]="keyword" name="keyword"
                  class="flex-grow-1" (keyup.enter)="onSearch()" />
                <button nz-button nzType="primary" style="width: 40px;" nzSize="small" (click)="onSearch()">
                  <nz-icon nzType="search" />
                </button>
              </div>
            </nz-form-control>
          </nz-form-item>
        </nz-col>
      </nz-row>
    </div>
  </div>

  <!-- ===== Vùng bảng dữ liệu ===== -->
  <div class="ctr-table-area">
    <app-custom-table [data]="tableData" [textWrap]="true" [columns]="columns" [loading]="isLoading" dataKey="ID"
      [scrollable]="true" scrollHeight="flex" [showGlobalFilter]="false" [paginator]="false" [rows]="20"
      rowGroupMode="subheader" groupRowsBy="DepartmentName" [expandableRowGroups]="true"
      [rowsPerPageOptions]="[20, 50, 100]" fontSize="12px" [clickSelectRow]="true"
      (rowClick)="onRowClickToggleSelection($event)" selectionMode="multiple" [(selection)]="selectedRequests"
      [contextMenuItems]="contextMenuItems" (contextMenuSelectionChange)="onContextMenuSelectionChange($event)">
      <ng-template #cellTemplate let-rowData let-col="col">
        <!-- Trạng thái -->
        <ng-container *ngIf="col.field === 'StatusName'">
          <nz-tag [nzColor]="getStatusColor(rowData.Status)">{{rowData.StatusName}}</nz-tag>
        </ng-container>

        <!-- Thao tác -->
        <ng-container *ngIf="col.field === '_action'">
          <div class="d-flex gap-1 flex-wrap">
            <!-- Xem / Chỉnh sửa -->
            <button nz-button nzSize="small" nzType="primary" (click)="openDetail(rowData)" title="Xem chi tiết">
              <span nz-icon nzType="eye"></span> Xem
            </button>

            <!-- Phiếu CBQL – chỉ HR -->
            <button *ngIf="checkRole() === 'hr'" nz-button nzSize="small"
              style="background:#6f42c1;border-color:#6f42c1;color:#fff" (click)="openDetailNew(rowData)"
              title="Mở phiếu đánh giá CBQL">
              <span nz-icon nzType="file-text"></span> CBQL
            </button>

            <!-- Xóa (chỉ HR và phiếu chưa qua bước NV xác nhận) -->
            <button *ngIf="canDeleteRow(rowData)" nz-button nzSize="small" nzDanger (click)="onDelete(rowData)"
              title="Xóa phiếu">
              <span nz-icon nzType="delete"></span>
            </button>

            <!-- Lịch sử thao tác -->
            <button nz-button nzSize="small" nzType="default" style="background:#17a2b8;border-color:#17a2b8;color:#fff"
              (click)="openRowActivityLog(rowData)" title="Xem lịch sử thao tác">
              <span nz-icon nzType="history"></span>
            </button>
          </div>
        </ng-container>
      </ng-template>
    </app-custom-table>
  </div>
</div>
