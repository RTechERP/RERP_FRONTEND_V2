<div class="d-flex flex-column h-100 w-100 overflow-hidden">
  <!-- Dòng 1: Menubar / Nút chức năng -->
  <div class="bg-white p-1 flex-shrink-0">
    <p-menubar [model]="hrRecruitmentApproveMenu" class="p-0 border-0" style="width: 100%">
      <ng-template pTemplate="start">
        <div class="page-title ms-2 me-3">
          <span nz-icon nzType="solution" nzTheme="outline" class="me-2"></span>
          Phê Duyệt Tuyển Dụng
        </div>
      </ng-template>
    </p-menubar>
  </div>

  <!-- Dòng 2: Filter tìm kiếm -->
  <div class="filter-bar bg-light border-bottom p-2 flex-shrink-0">
    <form nz-form>
      <nz-row [nzGutter]="[8, 8]" nzAlign="bottom">
        <!-- Từ ngày -->
        <nz-col [nzXs]="12" [nzSm]="12" [nzMd]="6" [nzLg]="3" [nzXl]="3">
          <nz-form-item class="mb-0">
            <nz-form-label class="fs-12">Từ ngày</nz-form-label>
            <nz-form-control>
              <input type="date" class="form-control form-control-sm date-input-sm w-100"
                [ngModel]="dateStart | date: 'yyyy-MM-dd'" (ngModelChange)="onDateChange('dateStart', $event)"
                name="dateStart2" title="Từ ngày" />
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <!-- Đến ngày -->
        <nz-col [nzXs]="12" [nzSm]="12" [nzMd]="6" [nzLg]="3" [nzXl]="3">
          <nz-form-item class="mb-0">
            <nz-form-label class="fs-12">Đến ngày</nz-form-label>
            <nz-form-control>
              <input type="date" class="form-control form-control-sm date-input-sm w-100"
                [ngModel]="dateEnd | date: 'yyyy-MM-dd'" (ngModelChange)="onDateChange('dateEnd', $event)"
                name="dateEnd2" title="Đến ngày" />
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <!-- Phòng ban -->
        <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="6" [nzXl]="4">
          <nz-form-item class="mb-0">
            <nz-form-label class="fs-12">Phòng ban</nz-form-label>
            <nz-form-control>
              <nz-select name="departmentId" [(ngModel)]="departmentId" nzPlaceHolder="Tất cả phòng ban" nzSize="small"
                class="w-100" nzAllowClear nzShowSearch>
                <nz-option [nzValue]="-1" nzLabel="--Tất cả--"></nz-option>
                <nz-option *ngFor="let dept of departmentList" [nzValue]="dept.ID" [nzLabel]="dept.Name">
                </nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <!-- Nhân viên -->
        <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="6" [nzXl]="5">
          <nz-form-item class="mb-0">
            <nz-form-label class="fs-12">Nhân viên</nz-form-label>
            <nz-form-control>
              <nz-select name="employeeId" [(ngModel)]="employeeId" nzShowSearch nzAllowClear
                nzPlaceHolder="--Chọn nhân viên--" nzSize="small" class="w-100">
                @for (parent of employees; track $index) {
                <nz-option-group [nzLabel]="parent.label">
                  @for (child of parent.options; track $index) {
                  <nz-option nzCustomContent="true" [nzLabel]="child.item?.Code + ' - ' + child.item?.FullName"
                    [nzValue]="child.item.EmployeeID">
                    {{ child.item.Code + " - " + child.item.FullName }}
                  </nz-option>
                  }
                </nz-option-group>
                }
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <!-- Từ khóa -->
        <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="6" [nzXl]="4">
          <nz-form-item class="mb-0">
            <nz-form-label class="fs-12">Từ khóa</nz-form-label>
            <nz-form-control>
              <input nz-input placeholder="Nhập từ khóa..." nzSize="small" [(ngModel)]="keyword" name="keyword"
                class="w-100" style="font-size: 12px" (keyup.enter)="onSearch()" />
            </nz-form-control>
          </nz-form-item>
        </nz-col>

        <!-- Nút tìm kiếm & Làm mới -->
        <nz-col [nzXs]="24" [nzSm]="24" [nzMd]="12" [nzLg]="6" [nzXl]="5">
          <nz-form-item class="mb-0">
            <nz-form-control>
              <div class="d-flex gap-1">
                <button nz-button nzType="primary" nzSize="small" (click)="onSearch()">
                  <span nz-icon nzType="search"></span> Tìm kiếm
                </button>
                <button nz-button nzType="default" nzSize="small" (click)="onReset()">
                  <span nz-icon nzType="reload"></span> Làm mới
                </button>
              </div>
            </nz-form-control>
          </nz-form-item>
        </nz-col>
      </nz-row>
    </form>
  </div>

  <!-- Dòng 3: Vùng Bảng dữ liệu với height full & paginator -->
  <div class="table-area">
    <nz-spin [nzSpinning]="isLoading" style="height:100%; display:block;">
      <app-custom-table [data]="tableData" [columns]="columns" [loading]="isLoading" dataKey="ID" [scrollable]="true"
        scrollHeight="flex" height="100%" [showGlobalFilter]="false" [paginator]="true" [rows]="25"
        [rowsPerPageOptions]="[10, 25, 50, 100]" fontSize="12px" [clickSelectRow]="true"
        (rowClick)="handleRowClick($event)" selectionMode="multiple" [(selection)]="selectedRows" [textWrap]="true"
        (cellAction)="onCellAction($event)">
      </app-custom-table>
    </nz-spin>
  </div>
</div>
