<div class="modal-dialog-scrollable">
  <!-- Header -->
  <div class="modal-header bg-primary text-uppercase py-2">
    <h6 class="modal-title text-white">Dự trù ngân sách</h6>
    <button type="button" class="btn-close" (click)="onClose()" aria-label="Close"></button>
  </div>

  <!-- Body -->
  <div class="modal-body">
    <div *ngIf="isLoadingData" style="
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(255,255,255,0.5);
        z-index: 999;
        display: flex; align-items: center; justify-content: center;">
      <nz-spin [nzSpinning]="isLoadingData"></nz-spin>
    </div>

    <form nz-form [formGroup]="form" nzLayout="vertical">
      <div nz-row [nzGutter]="16">

        <!-- Nhà cung cấp -->
        <div nz-col [nzSpan]="24">
          <nz-form-item>
            <nz-form-label>Nhà cung cấp <span class="text-danger ps-1">(*)</span></nz-form-label>
            <nz-form-control nzErrorTip="Vui lòng chọn nhà cung cấp!">
              <nz-select formControlName="SupplierID" nzShowSearch nzAllowClear nzDropdownClassName="select-dropdown"
                nzPlaceHolder="Chọn nhà cung cấp" class="w-100">
                <nz-option *ngFor="let s of suppliers" [nzValue]="s.ID" [nzLabel]="s.NameNCC"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Người giao -->
        <div nz-col [nzSpan]="6">
          <nz-form-item>
            <nz-form-label>Người giao <span class="text-danger ps-1">(*)</span></nz-form-label>
            <nz-form-control nzErrorTip="Vui lòng chọn người giao!">
              <nz-select formControlName="DeliveryPerson" nzShowSearch nzAllowClear
                nzDropdownClassName="select-dropdown" nzPlaceHolder="Chọn người giao" class="w-100">
                <ng-container *ngFor="let group of employees">
                  <nz-option-group [nzLabel]="group.label">
                    <nz-option *ngFor="let option of group.options"
                      [nzLabel]="option.item.Code + ' - ' + option.item.FullName" [nzValue]="option.item.EmployeeID">
                    </nz-option>
                  </nz-option-group>
                </ng-container>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- PO NCC -->
        <div nz-col [nzSpan]="4">
          <nz-form-item>
            <nz-form-label>PO NCC</nz-form-label>
            <nz-form-control>
              <nz-select formControlName="PONCCID" nzShowSearch nzAllowClear nzDropdownClassName="select-dropdown"
                nzPlaceHolder="Chọn PO NCC" class="w-100">
                <nz-option *ngFor="let item of poNCCs" [nzValue]="item.ID" [nzLabel]="item.BillCode"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Số hóa đơn -->
        <div nz-col [nzSpan]="10">
          <nz-form-item>
            <nz-form-label>Số hóa đơn</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="InvoiceCode" placeholder="Nhập số hóa đơn" />
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Ngày hóa đơn -->
        <div nz-col [nzSpan]="4">
          <nz-form-item>
            <nz-form-label>Ngày hóa đơn</nz-form-label>
            <nz-form-control>
              <nz-date-picker class="w-100" nzFormat="dd/MM/yyyy" formControlName="InvoiceDate"
                nzPlaceHolder="Chọn ngày hóa đơn"></nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>


        <!-- Ngày tới hạn -->
        <div nz-col [nzSpan]="5">
          <nz-form-item>
            <nz-form-label>Ngày tới hạn <span class="text-danger ps-1">(*)</span></nz-form-label>
            <nz-form-control nzErrorTip="Ngày tới hạn lớn hơn bằng ngày hiện tại!">
              <nz-date-picker class="w-100" nzFormat="dd/MM/yyyy" formControlName="DueDate"
                nzPlaceHolder="Chọn ngày tới hạn"></nz-date-picker>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Số tiền -->
        <div nz-col [nzSpan]="5">
          <nz-form-item>
            <nz-form-label>Đơn giá</nz-form-label>
            <nz-form-control>
              <nz-input-number class="w-100" formControlName="Amount" [nzMin]="0" [nzFormatter]="formatAmount"
                [nzParser]="parseAmount"></nz-input-number>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- % thanh toán -->
        <div nz-col [nzSpan]="4">
          <nz-form-item>
            <nz-form-label>% thanh toán <span class="text-danger ps-1">(*)</span></nz-form-label>
            <nz-form-control nzErrorTip="Vui lòng nhập % thanh toán (0 - 100)!">
              <nz-input-number class="w-100" formControlName="PaymentPercentage" [nzMin]="0" [nzMax]="100"
                [nzFormatter]="formatPercent" [nzParser]="parsePercent"></nz-input-number>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Loại tiền -->
        <div nz-col [nzSpan]="5">
          <nz-form-item>
            <nz-form-label>Loại tiền <span class="text-danger ps-1">(*)</span></nz-form-label>
            <nz-form-control nzErrorTip="Vui lòng chọn loại tiền!">
              <nz-select class="w-100" nzPlaceHolder="Chọn loại tiền" name="CurrencyID" formControlName="CurrencyID">
                <nz-option *ngFor="let item of currencies" [nzValue]="item.ID"
                  [nzLabel]="item.Code + ' - ' + formatAmount(item.CurrencyRate)"></nz-option>
              </nz-select>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Thành VNĐ -->
        <div nz-col [nzSpan]="5">
          <nz-form-item>
            <nz-form-label>Thành VNĐ</nz-form-label>
            <nz-form-control>
              <nz-input-number class="w-100" formControlName="AmountVND" [nzMin]="0" nzDisabled
                [nzFormatter]="formatAmount" [nzParser]="parseAmount"></nz-input-number>
            </nz-form-control>
          </nz-form-item>
        </div>

      </div>

      <!-- Dòng 2 -->
      <div nz-row [nzGutter]="16">

        <!-- Dự trù NCC trong nước -->
        <div nz-col [nzSpan]="5">
          <nz-form-item>
            <nz-form-label>Dự trù NCC trong nước</nz-form-label>
            <nz-form-control>
              <nz-input-number class="w-100" formControlName="BudgetDomestic" [nzMin]="0" [nzFormatter]="formatAmount"
                [nzParser]="parseAmount">
              </nz-input-number>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Dự trù NCC nước ngoài -->
        <div nz-col [nzSpan]="5">
          <nz-form-item>
            <nz-form-label>Dự trù NCC nước ngoài</nz-form-label>
            <nz-form-control>
              <nz-input-number class="w-100" formControlName="BudgetForeign" [nzMin]="0" [nzFormatter]="formatAmount"
                [nzParser]="parseAmount">
              </nz-input-number>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Tiền phát sinh -->
        <div nz-col [nzSpan]="5">
          <nz-form-item>
            <nz-form-label>Tiền phát sinh</nz-form-label>
            <nz-form-control>
              <nz-input-number class="w-100" formControlName="ExtraAmount" [nzMin]="0" [nzFormatter]="formatAmount"
                [nzParser]="parseAmount">
              </nz-input-number>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Chi phí văn phòng -->
        <div nz-col [nzSpan]="5">
          <nz-form-item>
            <nz-form-label>Chi phí văn phòng</nz-form-label>
            <nz-form-control>
              <nz-input-number class="w-100" formControlName="OfficeExpense" [nzMin]="0" [nzFormatter]="formatAmount"
                [nzParser]="parseAmount">
              </nz-input-number>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Thuế -->
        <div nz-col [nzSpan]="4">
          <nz-form-item>
            <nz-form-label>Thuế</nz-form-label>
            <nz-form-control>
              <nz-input-number class="w-100" formControlName="TaxAmount" [nzMin]="0" [nzFormatter]="formatAmount"
                [nzParser]="parseAmount">
              </nz-input-number>
            </nz-form-control>
          </nz-form-item>
        </div>

        <!-- Ghi chú -->
        <div nz-col [nzSpan]="24">
          <nz-form-item>
            <nz-form-label>Ghi chú</nz-form-label>
            <nz-form-control>
              <input nz-input formControlName="Note" placeholder="Nhập ghi chú" />
            </nz-form-control>
          </nz-form-item>
        </div>

      </div>
    </form>
  </div>

  <!-- Footer -->
  <div class="modal-footer">
    <button class="fs-12 btn" nz-button nzDanger (click)="onClose()">Đóng</button>
    <button class="fs-12 btn" nz-button nzType="primary" [nzLoading]="isSaving" (click)="onSave()">Lưu</button>
  </div>
</div>
