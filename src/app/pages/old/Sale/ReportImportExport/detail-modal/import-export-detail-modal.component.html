<div class="modal-header bg-primary text-uppercase py-2 flex-shrink-0">
  <h6 class="modal-title text-white">Lịch sử nhập xuất</h6>
  <button type="button" class="btn-close" (click)="closeModal()" aria-label="Close"></button>
</div>

<div class="modal-body p-2 flex-grow-1 d-flex flex-column overflow-hidden" style="height: calc(100vh - 80px);">
  <form nz-form [nzLayout]="'horizontal'" class="mt-2 flex-shrink-0">
    <!-- Dòng 1: Mã sản phẩm & Tên sản phẩm -->
    <div class="row gx-2 mb-2 align-items-end small-input-row">
      <!-- Mã sản phẩm -->
      <div class="col-md-6 col-sm-12">
        <label class="form-label m-0">Mã sản phẩm</label>
        <input nz-input nzSize="small" [(ngModel)]="productSale.productCode" name="productCode"
          class="form-control-like text-uppercase w-100" readonly disabled />
      </div>

      <!-- Tên sản phẩm -->
      <div class="col-md-6 col-sm-12">
        <label class="form-label m-0">Tên sản phẩm</label>
        <input nz-input nzSize="small" [(ngModel)]="productSale.productName" name="productName"
          class="form-control-like w-100" readonly disabled />
      </div>
    </div>

    <!-- Dòng 2: Các trường còn lại, chia đều -->
    <div class="row gx-2 mb-2 align-items-end small-input-row">
      <!-- Mỗi col chiếm 1/5 chiều rộng -->
      <div class="col">
        <label class="form-label m-0">Tồn kho đầu kỳ</label>
        <input nz-input nzSize="small" [(ngModel)]="productSale.tonDauKy" name="tonDauKy"
          class="form-control-like text-end w-100" readonly disabled />
      </div>

      <div class="col">
        <label class="form-label m-0">Nhập</label>
        <input nz-input nzSize="small" type="number" [(ngModel)]="productSale.tongNhap" name="tongNhap"
          class="form-control-like text-end w-100" readonly disabled />
      </div>

      <div class="col">
        <label class="form-label m-0">Xuất</label>
        <input nz-input nzSize="small" type="number" [(ngModel)]="productSale.tongXuat" name="tongXuat"
          class="form-control-like text-end w-100" readonly disabled />
      </div>

      <div class="col">
        <label class="form-label m-0">SL giữ</label>
        <input nz-input nzSize="small" type="number" [(ngModel)]="productSale.soLuongGiu" name="soLuongGiu"
          class="form-control-like text-end w-100" readonly disabled />
      </div>

      <div class="col">
        <label class="form-label m-0">Tồn kho cuối kỳ</label>
        <input nz-input nzSize="small" [(ngModel)]="productSale.tonCuoiky" name="tonCuoiKy"
          class="form-control-like text-end w-100" readonly disabled />
      </div>
    </div>
  </form>

  <nz-splitter class="flex-grow-1" style="height: 0;">
    <nz-splitter-panel [nzCollapsible]="true" nzResizable="true">
      <div class="panel-container d-flex flex-column h-100">
        <div class="panel-header bg-light p-1 border-bottom">
          <h6 class="m-0 fs-12">Chi tiết Nhập</h6>
        </div>
        <div class="grid-container flex-grow-1" style="height: 0;">
          <angular-slickgrid [gridId]="gridIdImport" [columns]="columnDefinitionsImport" [options]="gridOptionsImport"
            [dataset]="datasetImport" (onAngularGridCreated)="angularGridReadyImport($event.detail)"
            (onDblClick)="handleRowDoubleClickImport($event)">
          </angular-slickgrid>
        </div>
      </div>
    </nz-splitter-panel>
    <nz-splitter-panel [nzCollapsible]="true" nzResizable="true">
      <div class="panel-container d-flex flex-column h-100">
        <div class="panel-header bg-light p-1 border-bottom">
          <h6 class="m-0 fs-12">Chi tiết Xuất</h6>
        </div>
        <div class="grid-container flex-grow-1" style="height: 0;">
          <angular-slickgrid [gridId]="gridIdExport" [columns]="columnDefinitionsExport" [options]="gridOptionsExport"
            [dataset]="datasetExport" (onAngularGridCreated)="angularGridReadyExport($event.detail)"
            (onDblClick)="handleRowDoubleClickExport($event)">
          </angular-slickgrid>
        </div>
      </div>
    </nz-splitter-panel>
  </nz-splitter>
  <div class="modal-footer flex-shrink-0">
    <button class="fs-12 btn" nz-button nzDanger (click)="closeModal()">Đóng</button>
  </div>
</div>
<style>
  .form-control-like {
    border: 1px solid #d9d9d9;
    background-color: #fff;
    font-size: 12px;
    height: 28px;
    padding: 0 6px;
    border-radius: 2px;
  }

  .small-input-row label {
    font-size: 12px;
    white-space: nowrap;
  }
</style>
