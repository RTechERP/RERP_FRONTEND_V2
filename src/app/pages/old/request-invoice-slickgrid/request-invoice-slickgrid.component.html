<ng-container class="w-100">
  <div class="card h-100 border-0 rounded-0 d-flex flex-column">

    <!-- Header với p-menubar -->
    <div class="card-header bg-white p-0" style="flex-shrink: 0;">
      <p-menubar [model]="menuBars">
        <ng-template pTemplate="item" let-item>
          <a class="p-menuitem-link" [ngClass]="item.styleClass">
            <i [class]="item.icon"></i>
            <span class="p-menuitem-text">{{ item.label }}</span>
          </a>
        </ng-template>
      </p-menubar>
    </div>

    <!-- Filter bar - hiển thị dạng hàng ngang -->
    <div class="filter-bar bg-light border-bottom p-2">
      <form nz-form nzLayout="inline" class="d-flex flex-wrap gap-2 align-items-end">
        <nz-form-item class="mb-0">
          <nz-form-label class="fs-12">Từ ngày</nz-form-label>
          <nz-form-control>
            <input type="date" class="ant-input" style="width: 150px; font-size: 12px; height: 24px;"
              [(ngModel)]="filters.startDate" name="startDate" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item class="mb-0">
          <nz-form-label class="fs-12">Đến ngày</nz-form-label>
          <nz-form-control>
            <input type="date" class="ant-input" style="width: 150px; font-size: 12px; height: 24px;"
              [(ngModel)]="filters.endDate" name="endDate" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item class="mb-0">
          <nz-form-label class="fs-12">Từ khóa</nz-form-label>
          <nz-form-control>
            <input nz-input placeholder="Nhập từ khóa" nzSize="small" [(ngModel)]="filters.filterText" name="filterText"
              style="width: 150px"
              (keyup.enter)="loadMainData(filters.startDate, filters.endDate, filters.filterText)" />
          </nz-form-control>
        </nz-form-item>

        <nz-form-item class="mb-0">
          <nz-form-control>
            <div class="d-flex gap-1">
              <button nz-button nzType="primary" nzSize="small"
                (click)="loadMainData(filters.startDate, filters.endDate, filters.filterText)">
                Tìm kiếm
              </button>
            </div>
          </nz-form-control>
        </nz-form-item>
      </form>
    </div>

    <!-- Content -->
    <div class="card-body p-0 flex-grow-1" style="min-height: 0;">
      <nz-splitter nzLayout="vertical" class="h-100 request-invoice-splitter">
        <nz-splitter-panel nzSize="" [nzCollapsible]="true" nzResizable="true">
          <div class="card h-100 border-0 rounded-0 d-flex flex-column">
            <div class="card-body p-0 flex-grow-1 grid-container-main" style="overflow: hidden;">
              <nz-spin [nzSpinning]="isLoadingMain" nzTip="Đang tải dữ liệu..." class="h-100 w-100">
                <angular-slickgrid [gridId]="'gridMain_' + uniqueId" [columns]="columnDefinitionsMain"
                  [options]="gridOptionsMain" [dataset]="datasetMain"
                  (onAngularGridCreated)="angularGridReadyMain($event.detail)"
                  (onClick)="onMainRowClick($event.detail.eventData, $event.detail.args)"
                  (onDblClick)="onMainRowDblClick($event.detail.eventData, $event.detail.args)">
                </angular-slickgrid>
              </nz-spin>
            </div>
          </div>
        </nz-splitter-panel>

        <nz-splitter-panel nzDefaultSize="40%" [nzCollapsible]="true" nzResizable="true">
          <nz-splitter>
            <nz-splitter-panel>
              <div class="card h-100 border-0 rounded-0 d-flex flex-column">
                <div class="card-body p-0 flex-grow-1 grid-container-detail"
                  style="overflow: hidden; position: relative; min-height: 0;">
                  <nz-spin [nzSpinning]="isLoadingDetail" nzTip="Đang tải..." class="h-100 w-100">
                    <angular-slickgrid [gridId]="'gridDetail_' + uniqueId" [columns]="columnDefinitionsDetail"
                      [options]="gridOptionsDetail" [dataset]="datasetDetail"
                      (onAngularGridCreated)="angularGridReadyDetail($event.detail)"
                      (onClick)="onDetailRowClick($event.detail.eventData, $event.detail.args)">
                    </angular-slickgrid>
                  </nz-spin>
                </div>
              </div>
            </nz-splitter-panel>
            <nz-splitter-panel nzDefaultSize="23%" [nzCollapsible]="true" nzResizable="true">
              <div class="card h-100 border-0 rounded-0 d-flex flex-column">
                <!-- Tab Headers -->
                <div class="d-flex border-bottom bg-light flex-shrink-0" style="font-size: 0.75rem;">
                  <button type="button" class="btn btn-sm text-nowrap rounded-0 px-3 py-2 border-0"
                    [class.bg-white]="activeFilesTab === 0" [class.fw-bold]="activeFilesTab === 0"
                    [class.border-bottom]="activeFilesTab === 0" [class.border-primary]="activeFilesTab === 0"
                    (click)="selectFilesTab(0)">
                    <i></i>D/S file
                  </button>
                  <button type="button" class="btn btn-sm text-nowrap rounded-0 px-3 py-2 border-0"
                    [class.bg-white]="activeFilesTab === 1" [class.fw-bold]="activeFilesTab === 1"
                    [class.border-bottom]="activeFilesTab === 1" [class.border-primary]="activeFilesTab === 1"
                    (click)="selectFilesTab(1)">
                    <i></i>File Hợp đồng
                  </button>
                  <button type="button" class="btn btn-sm text-nowrap rounded-0 px-3 py-2 border-0"
                    [class.bg-white]="activeFilesTab === 2" [class.fw-bold]="activeFilesTab === 2"
                    [class.border-bottom]="activeFilesTab === 2" [class.border-primary]="activeFilesTab === 2"
                    (click)="selectFilesTab(2)">
                    <i></i>File PO
                  </button>
                </div>

                <!-- Tab Contents -->
                <div class="card-body p-0 flex-grow-1" style="min-height: 0; position: relative;">
                  <div *ngIf="activeFilesTab === 0" class="h-100 w-100 grid-container-file">
                    <nz-spin [nzSpinning]="isLoadingFile" nzTip="Đang tải..." class="h-100 w-100">
                      <angular-slickgrid [gridId]="'gridFile_' + uniqueId" [columns]="columnDefinitionsFile"
                        [options]="gridOptionsFile" [dataset]="datasetFile"
                        (onAngularGridCreated)="angularGridReadyFile($event.detail)"
                        (onClick)="onFileRowClick($event.detail.eventData, $event.detail.args)"
                        (onDblClick)="onFileRowDblClick($event.detail.eventData, $event.detail.args)">
                      </angular-slickgrid>
                    </nz-spin>
                  </div>

                  <div *ngIf="activeFilesTab === 1" class="h-100 w-100 grid-container-contractfile">
                    <nz-spin [nzSpinning]="isLoadingContractFile" nzTip="Đang tải..." class="h-100 w-100">
                      <angular-slickgrid [gridId]="'gridContractFile_' + uniqueId"
                        [columns]="columnDefinitionsContractFile" [options]="gridOptionsContractFile"
                        [dataset]="datasetContractFile"
                        (onAngularGridCreated)="angularGridReadyContractFile($event.detail)"
                        (onClick)="onContractFileRowClick($event.detail.eventData, $event.detail.args)"
                        (onDblClick)="onContractFileRowDblClick($event.detail.eventData, $event.detail.args)">
                      </angular-slickgrid>
                    </nz-spin>
                  </div>

                  <div *ngIf="activeFilesTab === 2" class="h-100 w-100 grid-container-pofile">
                    <nz-spin [nzSpinning]="isLoadingPOFile" nzTip="Đang tải..." class="h-100 w-100">
                      <angular-slickgrid [gridId]="'gridPOFile_' + uniqueId" [columns]="columnDefinitionsPOFile"
                        [options]="gridOptionsPOFile" [dataset]="datasetPOFile"
                        (onAngularGridCreated)="angularGridReadyPOFile($event.detail)"
                        (onClick)="onPOFileRowClick($event.detail.eventData, $event.detail.args)"
                        (onDblClick)="onPOFileRowDblClick($event.detail.eventData, $event.detail.args)">
                      </angular-slickgrid>
                    </nz-spin>
                  </div>
                </div>
              </div>
            </nz-splitter-panel>
          </nz-splitter>
        </nz-splitter-panel>
      </nz-splitter>
    </div>
  </div>
</ng-container>
