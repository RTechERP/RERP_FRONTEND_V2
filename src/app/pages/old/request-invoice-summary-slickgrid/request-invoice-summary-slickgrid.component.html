<ng-container class="w-100 h-100 d-flex flex-column">
    <!-- Header với p-menubar -->
    <div class="card-header bg-white p-0" style="flex-shrink: 0;">
        <p-menubar [model]="menuBars">
            <ng-template pTemplate="item" let-item>
                <a class="p-menuitem-link" [ngClass]="item.styleClass">
                    <i [class]="item.icon"></i>
                    <span class="p-menuitem-text">{{ item.label }}</span>
                </a>
            </ng-template>
        </p-menubar>
    </div>

    <!-- Filter bar - hiển thị dạng hàng ngang -->
    <div class="filter-bar bg-light border-bottom p-2">
        <form nz-form nzLayout="inline" class="d-flex flex-wrap gap-2 align-items-center">
            <nz-form-item class="mb-0">
                <nz-form-label class="fs-12" style="font-size: 12px; display: flex; align-items: center;">Từ
                    ngày</nz-form-label>
                <nz-form-control>
                    <input type="date" class="ant-input" style="width: 150px; font-size: 12px; height: 24px;"
                        [(ngModel)]="dateStart" name="startDate" />
                </nz-form-control>
            </nz-form-item>

            <nz-form-item class="mb-0">
                <nz-form-label class="fs-12" style="font-size: 12px; display: flex; align-items: center;">Đến
                    ngày</nz-form-label>
                <nz-form-control>
                    <input type="date" class="ant-input" style="width: 150px; font-size: 12px; height: 24px;"
                        [(ngModel)]="dateEnd" name="endDate" />
                </nz-form-control>
            </nz-form-item>

            <nz-form-item class="mb-0">
                <nz-form-label class="fs-12" style="font-size: 12px; display: flex; align-items: center;">Khách
                    hàng</nz-form-label>
                <nz-form-control>
                    <nz-select name="customerId" nzShowSearch nzAllowClear nzSize="small"
                        nzPlaceHolder="Chọn khách hàng" style="width: 180px;" [(ngModel)]="customerId">
                        <nz-option *ngFor="let item of customers" [nzValue]="item.ID"
                            [nzLabel]="item.FullName"></nz-option>
                    </nz-select>
                </nz-form-control>
            </nz-form-item>

            <nz-form-item class="mb-0">
                <nz-form-label class="fs-12" style="font-size: 12px; display: flex; align-items: center;">Người yêu
                    cầu</nz-form-label>
                <nz-form-control>
                    <nz-select name="userId" nzShowSearch nzAllowClear nzSize="small" nzPlaceHolder="Chọn người yêu cầu"
                        style="width: 180px;" [(ngModel)]="userId">
                        <nz-option *ngFor="let item of users" [nzValue]="item.ID" [nzLabel]="item.FullName"></nz-option>
                    </nz-select>
                </nz-form-control>
            </nz-form-item>

            <nz-form-item class="mb-0">
                <nz-form-label class="fs-12" style="font-size: 12px; display: flex; align-items: center;">Từ
                    khóa</nz-form-label>
                <nz-form-control>
                    <input nz-input placeholder="Nhập từ khóa" nzSize="small" [(ngModel)]="keywords" name="keywords"
                        style="width: 150px; font-size: 12px;" (keyup.enter)="loadMainData()" />
                </nz-form-control>
            </nz-form-item>

            <nz-form-item class="mb-0">
                <nz-form-control>
                    <button nz-button nzType="primary" nzSize="small" (click)="loadMainData()">
                        Tìm kiếm
                    </button>
                </nz-form-control>
            </nz-form-item>
        </form>
    </div>

    <!-- Content -->
    <div class="card-body p-0 flex-grow-1" style="min-height: 0;">
        <nz-splitter class="h-100">
            <nz-splitter-panel>
                <div class="grid-container" id="gridContainer">
                    <nz-spin [nzSpinning]="isLoading">
                        <angular-slickgrid gridId="requestInvoiceSummaryGrid" [columns]="columnDefinitions"
                            [options]="gridOptions" [dataset]="dataset"
                            (onAngularGridCreated)="onAngularGridCreated($event.detail)">
                        </angular-slickgrid>
                    </nz-spin>
                </div>
            </nz-splitter-panel>
            <nz-splitter-panel nzDefaultSize="20%" [nzCollapsible]="true" nzResizable="true">
                <div class="card h-100 border-0 rounded-0 d-flex flex-column">
                    <!-- Tab Headers -->
                    <div class="d-flex border-bottom bg-light flex-shrink-0" style="font-size: 0.75rem;">
                        <button type="button" class="btn btn-sm text-nowrap rounded-0 px-3 py-2 border-0"
                            [class.bg-white]="activeFilesTab === 0" [class.fw-bold]="activeFilesTab === 0"
                            [class.border-bottom]="activeFilesTab === 0" [class.border-primary]="activeFilesTab === 0"
                            (click)="selectFilesTab(0)">
                            <i></i>D/S file
                        </button>
                        <button type="button" class="btn btn-sm text-nowrap rounded-0 px-3 py-2 border-0"
                            [class.bg-white]="activeFilesTab === 1" [class.fw-bold]="activeFilesTab === 1"
                            [class.border-bottom]="activeFilesTab === 1" [class.border-primary]="activeFilesTab === 1"
                            (click)="selectFilesTab(1)">
                            <i></i>File Hợp đồng
                        </button>
                        <button type="button" class="btn btn-sm text-nowrap rounded-0 px-3 py-2 border-0"
                            [class.bg-white]="activeFilesTab === 2" [class.fw-bold]="activeFilesTab === 2"
                            [class.border-bottom]="activeFilesTab === 2" [class.border-primary]="activeFilesTab === 2"
                            (click)="selectFilesTab(2)">
                            <i></i>File PO
                        </button>
                    </div>

                    <!-- Tab Contents -->
                    <div class="card-body p-0 flex-grow-1" style="min-height: 0; position: relative;">
                        <div *ngIf="activeFilesTab === 0" class="h-100 w-100 grid-container-file">
                            <angular-slickgrid gridId="gridFile" [columns]="columnDefinitionsFile"
                                [options]="gridOptionsFile" [dataset]="datasetFile"
                                (onAngularGridCreated)="angularGridReadyFile($event.detail)"
                                (onClick)="onFileRowClick($event.detail.eventData, $event.detail.args)"
                                (onDblClick)="onFileRowDblClick($event.detail.eventData, $event.detail.args)">
                            </angular-slickgrid>
                        </div>

                        <div *ngIf="activeFilesTab === 1" class="h-100 w-100 grid-container-contractfile">
                            <angular-slickgrid gridId="gridContractFile" [columns]="columnDefinitionsContractFile"
                                [options]="gridOptionsContractFile" [dataset]="datasetContractFile"
                                (onAngularGridCreated)="angularGridReadyContractFile($event.detail)"
                                (onClick)="onContractFileRowClick($event.detail.eventData, $event.detail.args)"
                                (onDblClick)="onContractFileRowDblClick($event.detail.eventData, $event.detail.args)">
                            </angular-slickgrid>
                        </div>

                        <div *ngIf="activeFilesTab === 2" class="h-100 w-100 grid-container-pofile">
                            <angular-slickgrid gridId="gridPOFile" [columns]="columnDefinitionsPOFile"
                                [options]="gridOptionsPOFile" [dataset]="datasetPOFile"
                                (onAngularGridCreated)="angularGridReadyPOFile($event.detail)"
                                (onClick)="onPOFileRowClick($event.detail.eventData, $event.detail.args)"
                                (onDblClick)="onPOFileRowDblClick($event.detail.eventData, $event.detail.args)">
                            </angular-slickgrid>
                        </div>
                    </div>
                </div>
            </nz-splitter-panel>
        </nz-splitter>
    </div>
</ng-container>
